/* ================= CHECKLIST ================= */
function openChecklist(s, ci){
  currentSubject = s; currentChapterIdx = ci;
  hintSeen = {};
  const subs = chapters(s)[ci][1];
  currentOrder = subs.map((_,i)=>i);
  renderChecklist();
}

function shuffleOrder(){
  for(let i=currentOrder.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [currentOrder[i],currentOrder[j]]=[currentOrder[j],currentOrder[i]];
  }
}

function renderChecklist(){
  const s=currentSubject, ci=currentChapterIdx;
  const meta = subjectMeta(s);
  setAccent(meta);
  const chapterName = chapters(s)[ci][0];
  const subs = chapters(s)[ci][1];
  const stats = computeChapterStats(s,ci);

  const rowsHTML = currentOrder.map((si,pos)=>{
    const title = subs[si][0], hint = subs[si][1];
    const st = getItemState(s,ci,si);
    const hintUsedFlag = hintSeen[si] || st===1;
    const delay = Math.min(pos*26, 300);
    return `<div class="sub-row state-${st}" data-si="${si}" style="animation-delay:${delay}ms">
      <div class="sub-row-top">
        <button class="tick-btn" data-action="tick" data-si="${si}">${checkIconSVG}</button>
        <div class="sub-row-title">${title}</div>
        <button class="hint-btn ${hintUsedFlag?'used':''}" data-action="hint" data-si="${si}">?</button>
      </div>
      <div class="hint-pane" id="hint-${si}"><div class="hint-pane-inner">${hint}</div></div>
      <div class="assist-tag">Recalled with hint</div>
    </div>`;
  }).join('');

  setApp(`
    <div class="topbar">
      <button class="back" data-action="go-chapters">${backIconSVG}</button>
      <div class="title-wrap">
        <div class="eyebrow">${meta.label}</div>
        <h1>${chapterName}</h1>
      </div>
    </div>
    ${waveSVG()}
    <div class="wrap">
      <div class="progress-bar-wrap">
        <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${stats.pct}%"></div></div>
        <div class="progress-legend">
          <span><b>${stats.cold}</b> cold · <b>${stats.assisted}</b> assisted</span>
          <span>${stats.remaining} left</span>
        </div>
      </div>
      <div class="tools-row">
        <button class="chip" data-action="shuffle">${shuffleIconSVG} Shuffle order</button>
        <button class="chip reset-chip" data-action="reset-chapter">${resetIconSVG} Reset</button>
      </div>
      <div class="sub-list" id="subList">${rowsHTML || '<div class="empty-state">No subtopics found.</div>'}</div>
    </div>
  `);

  document.querySelector('[data-action="go-chapters"]').addEventListener('click', ()=> navigate(()=>renderChapterList(currentSubject), 'back'));
  document.querySelector('[data-action="shuffle"]').addEventListener('click', ()=>{ shuffleOrder(); navigate(renderChecklist, 'refresh'); });
  document.querySelector('[data-action="reset-chapter"]').addEventListener('click', ()=>{
    if(confirm('Reset all recall progress for this chapter?')){
      const subs2 = chapters(s)[ci][1];
      subs2.forEach((_,si)=>{ delete STATE.items[itemKey(s,ci,si)]; });
      persist();
      hintSeen = {};
      navigate(renderChecklist, 'refresh');
    }
  });
  document.querySelectorAll('[data-action="tick"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const si = parseInt(btn.dataset.si,10);
      const cur = getItemState(s,ci,si);
      let next;
      if(cur===0){ next = hintSeen[si] ? 1 : 2; }
      else { next = 0; hintSeen[si]=false; }
      setItemState(s,ci,si,next);
      updateRowDOM(s,ci,si,next);
      updateProgressDOM(s,ci);
    });
  });
  document.querySelectorAll('[data-action="hint"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const si = parseInt(btn.dataset.si,10);
      const pane = document.getElementById('hint-'+si);
      const st = getItemState(s,ci,si);
      if(st===0){ hintSeen[si]=true; btn.classList.add('used'); }
      pane.classList.toggle('open');
    });
  });
}

/* surgically update one row's DOM in place so CSS transitions between
   states actually play, instead of tearing down and rebuilding the row */
function updateRowDOM(s,ci,si,state){
  const row = document.querySelector('.sub-row[data-si="'+si+'"]');
  if(!row) return;
  row.className = 'sub-row state-'+state;
  const hintBtn = row.querySelector('.hint-btn');
  const hintUsedFlag = hintSeen[si] || state===1;
  hintBtn.classList.toggle('used', !!hintUsedFlag);
  const tickBtn = row.querySelector('.tick-btn');
  tickBtn.classList.remove('pop');
  void tickBtn.offsetWidth; /* force reflow so the animation can retrigger */
  tickBtn.classList.add('pop');
}

function updateProgressDOM(s,ci){
  const stats = computeChapterStats(s,ci);
  const fill = document.querySelector('.progress-bar-fill');
  if(fill) fill.style.width = stats.pct+'%';
  const legend = document.querySelector('.progress-legend');
  if(legend){
    legend.innerHTML = '<span><b>'+stats.cold+'</b> cold · <b>'+stats.assisted+'</b> assisted</span><span>'+stats.remaining+' left</span>';
  }
}

/* ================= INIT ================= */
renderHome();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('/SURFACE/sw.js').catch(()=>{});
  });
}

</script>
